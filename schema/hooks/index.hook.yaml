# manufacturing Module - Hooks Index
# Version: 2.0
#
# Module-level configuration for hooks (lifecycle behaviors).
# Hooks define: state machines, rules, permissions, triggers, computed fields.

module: manufacturing
version: 2

# Import all hook files.
imports:
  - manufacturing.hook.yaml

# =============================================================================
# Module-level configuration
# =============================================================================
config:
  audit:
    retention_days: 365
    archive_after_days: 90
    critical_events: []

  notifications:
    email_enabled: false
    sms_enabled: false
    push_enabled: false

# =============================================================================
# Shared domain events
# =============================================================================
events: {}

# =============================================================================
# Scheduled jobs
# =============================================================================
# ZERO scheduled jobs (deliberate, verified posture): every manufacturing
# transition fires synchronously from a service verb. The guard register lives in
# manufacturing.hook.yaml (state machines T1–T5 / W1–W4 / U1 / R1–R4 with
# enforcement keys grounded in actual DDL per ADR-0015, plus the ADR-0016
# lifecycle declarations on every status field in schema/models).
scheduled_jobs: {}
