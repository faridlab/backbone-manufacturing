# =============================================================================
# manufacturing Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA manufacturing` and qualify tables
# as `manufacturing.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: manufacturing
version: 2
schema: manufacturing
description: "manufacturing domain module"

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto
      # Dead scaffolding cut at the source: manufacturing wires only
      # service/validator/workflows in application/mod.rs, so these per-entity
      # layers were emitted but never declared (orphans — not compiled).
      # Disabling stops regen from re-creating them. Same pattern as backbone-catalog.
      - auth                 # no RBAC guards wired
      - bulk_operations      # no bulk create/update helpers wired
      - usecases             # no use-case orchestration wired
      # src/routes/ + src/handlers/ (composition + AppState) are likewise not declared
      # in lib.rs — manufacturing composes routes inline via all_crud_routes() instead.
      - routes_composer      # src/routes/mod.rs not wired
      - handlers_module      # src/handlers/mod.rs (AppState) not wired

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# =============================================================================
# company_fence (ADR-0014): Multi-tenant row-level security posture
# -----------------------------------------------------------------------------
# Posture: shared_blank — nullable company_id on MASTER DATA, NOT NULL on
# TRANSACTIONS (the fence vocabulary inventory established).
#
# Per ADR-0014, this declaration governs how the codegen stamps @required company_id
# and how ADR-0015 enforcement hooks ground the three keys (db/both/service) against
# the actual DDL. Posture options:
#   shared_blank  : nullable company_id — NULL rows are first-class shared rows
#                   (the port of Odoo's `[False]` escape). Applies to MASTER DATA:
#                   the product-definition family, which is reference data a
#                   multi-company group shares (a machine or a recipe is not a
#                   bookkeeping event).
#   strict        : NOT NULL company_id — every row belongs to exactly one company
#                   and NULL rows are rejected. The `company_id IS NULL` arm of the
#                   shared_blank RLS predicate is dead on these tables, making them
#                   behaviorally strict. Applies to TRANSACTIONS and their
#                   configuration: everything that emits or can emit a posting.
#
# LANDED DECISION (the earlier all-strict declaration carried the master-data
# question as open; it is decided now): master data escapes the fence with shared
# NULL rows; transactions stay strict. A NULL-company BOM or workstation is visible
# to every company session; a work order never can be.
#
# Posture map (entity -> realized fence, all under this one declaration):
#   MASTER DATA (shared_blank — nullable company_id, NULL = shared row):
#     workstations          -> shared_blank
#     workstation_losses    -> shared_blank
#     operations            -> shared_blank
#     boms                  -> shared_blank
#     bom_items             -> shared_blank
#     bom_operations        -> shared_blank
#     bom_byproducts        -> shared_blank
#     bom_subcontractors    -> shared_blank
#   TRANSACTIONS (strict — @required company_id, the IS NULL arm is dead):
#     work_orders           -> strict
#     work_order_items      -> strict
#     job_cards             -> strict
#     workstation_productivity -> strict
#     unbuild_orders        -> strict
#     repair_orders         -> strict
#     repair_parts          -> strict
#     repair_tags           -> strict
#     category_costing_defaults -> strict (defaults are company decisions)
#     subcontract_mo_links  -> strict
# -----------------------------------------------------------------------------
company_fence: shared_blank

# Import each entity model. Replace `example` with your real entities.
imports:
  - bom.model.yaml
  - work_order.model.yaml
  - unbuild.model.yaml
  - repair.model.yaml
  - costing_defaults.model.yaml
