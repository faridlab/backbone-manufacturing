# =============================================================================
# Domain: Manufacturing — product definition (master data, no GL)
# Entities: Workstation (+ WorkstationLoss + WorkstationProductivity), Operation,
#           Bom (+ BomItem + BomOperation + BomByproduct + BomSubcontractor)
# Description: WHAT to build. A Bom is the recipe for one manufactured item: its
# component materials (BomItem), the operations that convert them (BomOperation,
# each on a Workstation at an hourly rate), optional byproduct outputs with a
# cost-share split (BomByproduct), and — for subcontracted recipes — the read-only
# partner references (BomSubcontractor). The Bom's cost rolls up from components +
# operations. Region-neutral, posts NO GL: a Bom only DEFINES cost; the Work Order
# execution context is what emits WIP/FG postings. Cross-module ids are logical FKs.
#
# Tenancy: none, by design (ADR-0029) — this family declares no company axis; see
# the posture map in index.model.yaml for how the historical shared masters port to
# root-anchored org rows under the composing service's decorator.
# =============================================================================

models:
  - name: Workstation
    collection: workstations
    description: "A machine/work-center with an hourly conversion-cost rate"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique workstation id"
      workstation_name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Human name"
      hour_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Conversion cost per hour (labour + overhead)"
      capacity:
        type: decimal
        attributes: ["@default(1)", "@precision(18,4)", "@positive"]
        description: "Standard output per hour the workstation can produce (planning denominator)"
      time_efficiency:
        type: decimal
        attributes: ["@default(100)", "@precision(5,2)", "@non_negative"]
        description: "Efficiency factor in percent (100 = nominal speed); scales expected operation time"
      # replaces is_active (boolean flipped to lifecycle enum)
      status:
        type: WorkstationStatus
        attributes: ["@default(active)"]
        lifecycle:
          shape: hand_set
          sticky: false
        description: "Lifecycle (inactive workstations are hidden from new BOM operations; existing BOM lines keep their snapshotted rate)"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The org_unit_id-
    # leading status lookup is installed by the composing service's tenancy
    # decorator, not declared here.

  - name: WorkstationLoss
    collection: workstation_losses
    description: "A named productivity-loss reason, grouped into an OEE bucket"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique loss id"
      name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Human name of the loss reason"
      loss_type:
        type: LossType
        attributes: ["@required"]
        description: "The OEE bucket the loss counts against: productive | availability | performance | quality"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The org_unit_id-
    # leading loss-name unique (NULLS NOT DISTINCT, so root-shared and unit-owned
    # reasons keep one namespace) is installed by the composing service's tenancy
    # decorator, not declared here.

  - name: WorkstationProductivity
    collection: workstation_productivity
    description: "A timed productivity record on a workstation, tagged with its loss reason (the OEE input)"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique productivity record id"
      workstation_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Workstation.id)"]
        description: "The workstation the time was logged on"
      job_card_id:
        type: uuid?
        attributes: ["@foreign_key(JobCard.id)"]
        description: "The job card being run while the record was open, if any"
      loss_id:
        type: uuid
        attributes: ["@required", "@foreign_key(WorkstationLoss.id)"]
        description: "The loss reason the recorded duration counts as"
      date_start:
        type: datetime
        attributes: ["@default(now)"]
        description: "When the record opened"
      date_end:
        type: datetime?
        description: "When the record closed (NULL = still running); duration is read-side computed date_end - date_start — no stored column, no cron"
      description:
        type: string?
        description: "Free-text note"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: index
        fields: [workstation_id, date_start]

  - name: Operation
    collection: operations
    description: "A named production step (e.g. cut, assemble), optionally on a default workstation"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique operation id"
      operation_name:
        type: string
        attributes: ["@required", "@max(140)"]
        description: "Human name"
      default_workstation_id:
        type: uuid?
        attributes: ["@foreign_key(Workstation.id)"]
        description: "Default workstation for this operation"
      # replaces is_active (boolean flipped to lifecycle enum)
      status:
        type: OperationStatus
        attributes: ["@default(active)"]
        lifecycle:
          shape: hand_set
          sticky: false
        description: "Lifecycle (inactive operations are hidden from new BOM lines; existing lines keep their reference)"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The org_unit_id-
    # leading status lookup is installed by the composing service's tenancy
    # decorator, not declared here.

  - name: Bom
    collection: boms
    description: "The versioned recipe for one manufactured item — components + operations (+ byproducts + subcontractors), with a cost roll-up"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique BOM id"
      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The manufactured item # logical FK to catalog.Product.id"
      bom_code:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "BOM number (the org-scoped code unique is installed by the composing service's tenancy decorator, ADR-0029)"
      version:
        type: int
        attributes: ["@default(1)", "@positive"]
        description: "Revision number of this recipe for the item; a new revision is a new draft that must be activated to become selectable"
      bom_type:
        type: BomType
        attributes: ["@default(normal)"]
        description: "normal = manufactured in-house; kit = exploded through to components at demand time and NEVER given its own work order; subcontract = produced by a subcontractor partner against a purchase order"
      quantity:
        type: decimal
        attributes: ["@default(1)", "@precision(18,4)", "@positive"]
        description: "Base quantity this BOM produces (costs are per this qty)"
      uom:
        type: string?
        attributes: ["@max(20)"]
        description: "Unit of measure of the produced item"
      currency:
        type: string
        attributes: ["@default('IDR')", "@length(3)"]
        description: "Currency code"
      raw_material_cost:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ component amounts (rolled up)"
      operating_cost:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ operation costs (rolled up)"
      total_cost:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "raw_material_cost + operating_cost"
      # replaces is_active (boolean flipped to lifecycle enum); draft = staged revision,
      # not yet selectable for work-order confirmation
      status:
        type: BomStatus
        attributes: ["@default(active)"]
        lifecycle:
          shape: hand_set
          sticky: false
        description: "Lifecycle: draft revisions are not selectable at work-order confirmation; only active BOMs feed confirmation and cost roll-up; inactive BOMs are retired"
      is_default:
        type: bool
        attributes: ["@default(false)"]
        description: "The default BOM for the item"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The org_unit_id-
    # leading bom-code unique, the (org unit, item, version) revision unique, and the
    # (org unit, item, status) selection lookup are installed by the composing
    # service's tenancy decorator, not declared here.

  - name: BomItem
    collection: bom_items
    description: "One component line of a BOM"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"
      bom_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Bom.id)"]
        description: "Parent BOM"
      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Component item # logical FK to catalog.Product.id"
      quantity:
        type: decimal
        attributes: ["@required", "@precision(18,4)", "@positive"]
        description: "Quantity of the component per BOM base qty"
      rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Unit cost of the component (valuation rate)"
      amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "quantity × rate"
      is_phantom:
        type: bool
        attributes: ["@default(false)"]
        description: "A phantom sub-assembly — never stocked; at Work Order confirmation it is exploded THROUGH to its own BOM's components (resolved by item_id), not issued as a material."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: index
        fields: [bom_id]

  - name: BomOperation
    collection: bom_operations
    description: "One operation line of a BOM (drives operating cost)"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"
      bom_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Bom.id)"]
        description: "Parent BOM"
      operation_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Operation.id)"]
        description: "The operation performed"
      workstation_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Workstation.id)"]
        description: "Where it runs (supplies the hour rate)"
      time_in_mins:
        type: decimal
        attributes: ["@required", "@precision(18,4)", "@non_negative"]
        description: "Standard time for this operation per BOM base qty"
      hour_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Snapshotted workstation hourly rate"
      operating_cost:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "time_in_mins / 60 × hour_rate"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: index
        fields: [bom_id]

  - name: BomByproduct
    collection: bom_byproducts
    description: "A secondary item co-produced by the recipe, carrying a share of the cost"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"
      bom_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Bom.id)"]
        description: "Parent BOM"
      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The byproduct item # logical FK to catalog.Product.id"
      product_category_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Category whose costing defaults supply the byproduct's stock account — caller-supplied per the module's no-catalog-edge discipline # logical FK to catalog.ProductCategory.id"
      quantity:
        type: decimal
        attributes: ["@required", "@precision(18,4)", "@positive"]
        description: "Quantity of the byproduct per BOM base qty"
      cost_share:
        type: decimal
        attributes: ["@default(0)", "@precision(5,2)", "@non_negative"]
        description: "Percent of the receipt's value allocated to this byproduct (0 <= cost_share <= 100 per row; the sum across the BOM's byproducts is validated <= 100 at authoring)"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: index
        fields: [bom_id]

  - name: BomSubcontractor
    collection: bom_subcontractors
    description: "Read-only reference to a partner who produces this recipe as a subcontractor (no partner write surface in this module)"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"
      bom_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Bom.id)"]
        description: "Parent BOM (a subcontract-type BOM)"
      partner_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The subcontractor partner # logical FK to party.Party.id"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      - type: unique
        fields: [bom_id, partner_id]
        where: "deleted_at IS NULL"

enums:
  - name: WorkstationStatus
    description: "Lifecycle of a workstation"
    variants:
      - name: active
        description: "Selectable for new BOM operations"
        default: true
      - name: inactive
        description: "Hidden from new BOM operations; existing lines keep their snapshotted rate"

  - name: OperationStatus
    description: "Lifecycle of a production operation"
    variants:
      - name: active
        description: "Selectable for new BOM lines"
        default: true
      - name: inactive
        description: "Hidden from new BOM lines; existing lines keep their reference"

  - name: BomStatus
    description: "Lifecycle of a bill of materials (draft revisions stage before activation)"
    variants:
      - name: draft
        description: "A staged revision — NOT selectable for work-order confirmation or cost roll-up"
      - name: active
        description: "Usable for work-order confirmation and cost roll-up"
        default: true
      - name: inactive
        description: "Retired — hidden from work-order confirmation and cost roll-up"

  - name: LossType
    description: "The OEE bucket a workstation loss counts against"
    variants:
      - name: productive
        description: "Productive time (the numerator)"
        default: true
      - name: availability
        description: "Downtime counted against availability"
      - name: performance
        description: "Speed loss counted against performance"
      - name: quality
        description: "Rework/scrap time counted against quality"

  - name: BomType
    description: "How a recipe is fulfilled"
    variants:
      - name: normal
        description: "Manufactured in-house — its confirmation explodes components onto a work order"
        default: true
      - name: kit
        description: "A phantom kit — exploded through to components at demand time; NEVER given its own work order"
      - name: subcontract
        description: "Produced by a subcontractor partner; a receipt event against the purchase order mints a hidden confirmed work order"
