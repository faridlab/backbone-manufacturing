# =============================================================================
# Domain: Manufacturing — product-category costing defaults (transactional config)
# Entity: CategoryCostingDefaults
# Description: Per-org-unit, per-product-category account defaults for manufacturing
# postings. Resolution order everywhere: per-work-order / per-repair explicit
# override → category default → MissingAccount refusal. Never a hardcoded fallback
# account and never a silently skipped post.
# =============================================================================

models:
  # Tenancy: none, by design (ADR-0029). The module is tenant-agnostic; the composing
  # service's tenancy decorator owns org scoping for this table, including the
  # org-scoped one-row-per-(org unit, category) unique.
  - name: CategoryCostingDefaults
    collection: category_costing_defaults
    description: "GL account defaults for a product category's manufacturing postings (one row per org unit and category under the composed fence)"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique defaults row id"
      product_category_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The category these defaults apply to # logical FK to catalog.ProductCategory.id"
      wip_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Work-in-progress account # logical FK to accounting.Account.id"
      fg_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Finished-goods inventory account # logical FK to accounting.Account.id"
      raw_material_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Raw-material stock account # logical FK to accounting.Account.id"
      conversion_cost_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Conversion-cost-applied account # logical FK to accounting.Account.id"
      subcontract_interim_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Subcontract-interim account (clears the purchase order's value leg) # logical FK to accounting.Account.id"
      cost_variance_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Standard-cost variance plug account (required when a nonzero plug would post) # logical FK to accounting.Account.id"
      inventory_loss_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Inventory-loss account (destination of removed repair parts) # logical FK to accounting.Account.id"
      repair_expense_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Repair-expense account (charged by added / recycled repair parts) # logical FK to accounting.Account.id"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The org_unit_id-
    # leading one-row-per-category unique is installed by the composing service's
    # tenancy decorator, not declared here.
