server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/manufacturing.log
module:
  name: manufacturing
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  workstation:
    collection: workstations
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  operation:
    collection: operations
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  bom:
    collection: boms
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  bom_item:
    collection: bom_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  bom_operation:
    collection: bom_operations
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  work_order:
    collection: work_orders
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  work_order_item:
    collection: work_order_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  job_card:
    collection: job_cards
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  workstation_loss:
    collection: workstation_losses
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  workstation_productivity:
    collection: workstation_productivity
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  bom_byproduct:
    collection: bom_byproducts
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  bom_subcontractor:
    collection: bom_subcontractors
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  category_costing_defaults:
    collection: category_costing_defaults
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  repair_order:
    collection: repair_orders
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  repair_part:
    collection: repair_parts
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  repair_tag:
    collection: repair_tags
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  unbuild_order:
    collection: unbuild_orders
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  subcontract_mo_link:
    collection: subcontract_mo_links
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
